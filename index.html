/* ── GIRAFFE ANIMATION ──
   On hover: letters stretch upward one by one like a giraffe extending its neck,
   then gracefully return. Each character scales vertically from its baseline. */
.nav-item .ch {
  display: inline-block;
  transform-origin: center bottom;
  will-change: transform, letter-spacing;
}

/* ── MODAL / LIGHTBOX ── */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.modal.open {
  opacity: 1;
  pointer-events: all;
}

.modal-inner {
  position: relative;
  width: min(900px, 90vw);
  transform: scale(0.94) translateY(14px);
  opacity: 0;
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
}
.modal.open .modal-inner {
  transform: scale(1) translateY(0);
  opacity: 1;
}

.modal-close {
  position: absolute;
  top: -1.9rem;
  right: 0;
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--font);
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.38);
  transition: color 0.15s;
}
.modal-close:hover { color: #fff; }

.video-wrap {
  width: 100%;

  background: #080808;

#yt-frame {

  border: none;

}

<script>
/* ── CONFIGURE THESE WHEN READY ── */
const ORDER_URL = '';   // ← your shop / Bandcamp link
const WATCH_SRC = 'https://www.youtube.com/embed/D4SmyqO5DUU';   // ← https://www.youtube.com/embed/D4SmyqO5DUU

/* ────────────────────────────────────────────────
   GIRAFFE ANIMATION
   Each letter stretches up from its baseline like
   a giraffe extending its neck — tall, slow, graceful.
   Letters animate in sequence left→right on mouseenter,
   then collapse back right→left on mouseleave.
   ──────────────────────────────────────────────── */

function giraffStretch(chars, direction) {
  // direction: 'in' = stretch up, 'out' = collapse back
  chars.forEach((ch, i) => {
    const delay = i * 38; // stagger ms between each letter
    clearTimeout(ch._t);
    ch._t = setTimeout(() => {
      if (direction === 'in') {
        // Neck extends: scaleY up, slight forward lean (skewX), rise up
        ch.style.transition = 'transform 0.32s cubic-bezier(0.2, 0, 0.1, 1)';
        ch.style.transform  = `scaleY(1.38) translateY(-12%) skewX(-3deg)`;
        ch.style.opacity    = '0.82';
      } else {
        // Neck retracts: graceful ease back down
        ch.style.transition = 'transform 0.22s cubic-bezier(0.4, 0, 0.6, 1)';
        ch.style.transform  = 'scaleY(1) translateY(0) skewX(0deg)';
        ch.style.opacity    = '1';
      }
    }, delay);
  });
}

document.querySelectorAll('.nav-item').forEach(el => {
  const chars = Array.from(el.querySelectorAll('.ch'));

  el.addEventListener('mouseenter', () => {
    el.style.zIndex = '2';
    giraffStretch(chars, 'in');
  });

  el.addEventListener('mouseleave', () => {
    // Collapse right→left (head comes down first)
    giraffStretch([...chars].reverse(), 'out');
    const resetDelay = chars.length * 38 + 220;
    clearTimeout(el._zReset);
    el._zReset = setTimeout(() => { el.style.zIndex = '1'; }, resetDelay);
  });
});

/* ── ORDER ── */
document.getElementById('n-order').addEventListener('click', e => {
  e.preventDefault();
  if (ORDER_URL) window.open(ORDER_URL, '_blank');
});

/* ── WATCH MODAL ── */
const modal       = document.getElementById('modal');
const ytFrame     = document.getElementById('yt-frame');
const placeholder = document.getElementById('video-placeholder');

function toEmbedUrl(raw) {
  const s = raw.trim();
  const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  if (m) return 'https://www.youtube.com/embed/' + m[1] + '?autoplay=1&rel=0';
  return s ? s + (s.includes('?') ? '&' : '?') + 'autoplay=1&rel=0' : null;
}

document.getElementById('n-watch').addEventListener('click', e => {
  e.preventDefault();
  const embedUrl = toEmbedUrl(WATCH_SRC);
  if (embedUrl) {
    ytFrame.src = embedUrl;
    ytFrame.style.cssText = 'display:block;width:100%;aspect-ratio:16/9;border:none;';
    placeholder.style.display = 'none';
  } else {
    ytFrame.src = '';
    ytFrame.style.display = 'none';
    placeholder.style.display = 'flex';
  }
  modal.classList.add('open');
});

function closeModal() {
  modal.classList.remove('open');
  setTimeout(() => {
    ytFrame.src = '';
    ytFrame.style.display = 'none';
    placeholder.style.display = 'flex';
  }, 320);
}

document.getElementById('modal-close').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
