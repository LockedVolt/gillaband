/* COUNTDOWN — same position/size as nav on homepage */
.countdown {

  bottom: 2.8vh;
  right: 3.1vw;
  z-index: 10;

  flex-direction: row;
  align-items: flex-end;

}

.unit {

  align-items: center;
}

/* Same font size as nav items */
.unit-val {
  font-family: var(--font);
  font-weight: 700;
  font-size: clamp(28px, 4.17vw, 80px);
  letter-spacing: 0.04em;
  color: #ffffff;
  line-height: 1.08;
  min-width: 2ch;
  text-align: center;
}

.unit-lbl {
  font-family: var(--font);
  font-weight: 600;
  font-size: clamp(7px, 0.55vw, 10px);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--dim);
  text-align: center;
  margin-top: 0.3em;
  margin-bottom: 0.1em;
}

.sep {
  font-family: var(--font);
  font-weight: 700;
  font-size: clamp(28px, 4.17vw, 80px);
  color: rgba(255,255,255,0.18);
  line-height: 1.08;
  padding: 0 0.05em 0.05em;
  align-self: flex-end;
}

/* OUT NOW — shown when countdown expires */
.out-now {
  position: fixed;
  bottom: 2.8vh;
  right: 3.1vw;
  z-index: 10;
  font-family: var(--font);
  font-weight: 700;
  font-size: clamp(28px, 4.17vw, 80px);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #ffffff;
  line-height: 1.08;
  display: none;
}

/* digit tick flash */
@keyframes tickflash {
  0%   { opacity: 0.2; transform: translateY(-6px); }
  100% { opacity: 1;   transform: translateY(0); }
}
.ticked {
  animation: tickflash 0.16s ease-out;
}

/* ── SOCIAL LINKS ── */

.social-links a:hover {

@media (max-width: 768px) {

<script>
/* ── SET RELEASE DATE HERE ── */
const TARGET = new Date('2026-06-27T22:00:00'); // Jun 27 10pm local time

const D = document.getElementById('cd-d');
const H = document.getElementById('cd-h');
const M = document.getElementById('cd-m');
const S = document.getElementById('cd-s');
const cdWrap = document.getElementById('cd');
const outNow = document.getElementById('out-now');

function pad(n) { return String(n).padStart(2, '0'); }

function set(el, val) {
  if (el.textContent !== val) {
    el.textContent = val;
    el.classList.remove('ticked');
    void el.offsetWidth;
    el.classList.add('ticked');
  }
}

function tick() {
  const diff = TARGET - Date.now();
  if (diff <= 0) {
    cdWrap.style.display = 'none';
    outNow.style.display = 'block';
    return;
  }
  const ts = Math.floor(diff / 1000);
  set(S, pad(ts % 60));
  set(M, pad(Math.floor(ts / 60) % 60));
  set(H, pad(Math.floor(ts / 3600) % 24));
  set(D, pad(Math.floor(ts / 86400)));
}

tick();
setInterval(tick, 1000);
</script>
